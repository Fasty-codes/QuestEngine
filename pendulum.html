<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendulum Lab | QuestEngine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #f4f6f8;
            --surface: #ffffff;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --font-sans: 'Poppins', sans-serif;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        /* HEADER SYSTEM */
        header { position: fixed; top: 0; left: 0; width: 100%; background: var(--surface); z-index: 1000; border-bottom: 1px solid var(--border); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--text-main); text-decoration: none; }
        .logo span { color: var(--accent-blue); }
        
        .btn-back { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0.5rem 1rem; font-size: 0.9rem; font-weight: 600; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s ease; }
        .btn-back:hover { background: var(--bg-primary); color: var(--text-main); border-color: var(--text-muted); }

        /* MAIN CONTENT CONTAINER */
        .lab-container { max-width: 1000px; width: 100%; margin: 90px auto 3rem; padding: 0 1rem; flex: 1; }
        
        .lab-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        @media (min-width: 768px) { .lab-grid { grid-template-columns: 1.2fr 1fr; } }

        /* SIMULATION CANVAS WRAPPER */
        .sim-box { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        canvas { background: #f8fafc; border-radius: 8px; border: 1px solid var(--border); width: 100%; max-width: 500px; aspect-ratio: 1; }

        /* CONTROL PANEL */
        .control-panel { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        .panel-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        
        .control-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .control-label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; }
        .control-label span { color: var(--text-main); font-weight: 700; }
        
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: #e2e8f0; border-radius: 5px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-blue); cursor: pointer; transition: transform 0.1s; }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); background: var(--accent-blue-hover); }

        .btn-action { background: var(--accent-blue); color: white; border: none; padding: 0.75rem 1.5rem; font-size: 0.95rem; font-weight: 600; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 0.5rem; }
        .btn-action:hover { background: var(--accent-blue-hover); }
        .btn-reset { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); }
        .btn-reset:hover { background: #e2e8f0; }

        /* FOOTER */
        footer { background: rgba(0,0,0,0.02); border-top: 1px solid var(--border); padding: 1.5rem; text-align: center; margin-top: auto; font-size: 0.85rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Quest <span>Labs</span></a>
            <a href="labs.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Back</a>
        </div>
    </header>

    <main class="lab-container">
        <div class="lab-grid">
            
            <div class="sim-box">
                <canvas id="pendulumCanvas" width="400" height="400"></canvas>
            </div>
            
            <div class="control-panel">
                <h3 class="panel-title">Interactive Variables</h3>
                
                <div class="control-group">
                    <div class="control-label">String Length: <span id="valLength">150 px</span></div>
                    <input type="range" id="slideLength" min="50" max="250" value="150">
                </div>

                <div class="control-group">
                    <div class="control-label">Gravity Force: <span id="valGravity">9.8 m/s²</span></div>
                    <input type="range" id="slideGravity" min="1" max="25" step="0.1" value="9.8">
                </div>

                <div class="control-group">
                    <div class="control-label">Bob Mass: <span id="valMass">20 kg</span></div>
                    <input type="range" id="slideMass" min="5" max="40" value="20">
                </div>

                <button id="playPauseBtn" class="btn-action"><i class="fa-solid fa-pause"></i> Pause Lab</button>
                <button id="resetBtn" class="btn-action btn-reset"><i class="fa-solid fa-rotate-left"></i> Reset Motion</button>
            </div>
            
        </div>
    </main>

    <footer>
        <p>&copy; 2026 QuestEngine Play Ecosystem. All rights reserved.</p>
    </footer>

    <script>
        const canvas = document.getElementById('pendulumCanvas');
        const ctx = canvas.getContext('2d');

        // Core UI DOM Nodes
        const slideLength = document.getElementById('slideLength');
        const slideGravity = document.getElementById('slideGravity');
        const slideMass = document.getElementById('slideMass');
        const valLength = document.getElementById('valLength');
        const valGravity = document.getElementById('valGravity');
        const valMass = document.getElementById('valMass');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Physics State Machine Variables
        let length = parseFloat(slideLength.value);
        let gravity = parseFloat(slideGravity.value) * 0.04; // Scaled down factor for real-time canvas refresh
        let mass = parseFloat(slideMass.value);
        
        let angle = Math.PI / 4; // Initial displacement angle (45 degrees)
        let angularVelocity = 0.0;
        let angularAcceleration = 0.0;
        let damping = 0.995; // Simulates micro-air resistance friction
        let isRunning = true;

        // Origin pivot layout anchor points
        const originX = canvas.width / 2;
        const originY = 50;

        // Input Observers
        slideLength.oninput = function() { length = parseFloat(this.value); valLength.innerText = this.value + " px"; };
        slideGravity.oninput = function() { gravity = parseFloat(this.value) * 0.04; valGravity.innerText = this.value + " m/s²"; };
        slideMass.oninput = function() { mass = parseFloat(this.value); valMass.innerText = this.value + " kg"; };

        playPauseBtn.onclick = function() {
            isRunning = !isRunning;
            if (isRunning) {
                playPauseBtn.innerHTML = `<i class="fa-solid fa-pause"></i> Pause Lab`;
                playPauseBtn.style.background = "var(--accent-blue)";
            } else {
                playPauseBtn.innerHTML = `<i class="fa-solid fa-play"></i> Resume Lab`;
                playPauseBtn.style.background = "#059669"; // Emerald active accent color
            }
        };

        resetBtn.onclick = function() {
            angle = Math.PI / 4;
            angularVelocity = 0.0;
            angularAcceleration = 0.0;
        };

        // Engine Frame Vector Render Tick
        function updatePhysicsLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isRunning) {
                // Angular motion equation: alpha = -(g / L) * sin(theta)
                angularAcceleration = (-1 * gravity / length) * Math.sin(angle);
                angularVelocity += angularAcceleration;
                angularVelocity *= damping; // apply drag force constant
                angle += angularVelocity;
            }

            // Convert polar vector positions directly back into regular geometric XY coordinate nodes
            let bobX = originX + length * Math.sin(angle);
            let bobY = originY + length * Math.cos(angle);

            // Render Pivot Target Dot
            ctx.beginPath();
            ctx.arc(originX, originY, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#475569';
            ctx.fill();

            // Render Tension Support Wire Vector Line
            ctx.beginPath();
            ctx.moveTo(originX, originY);
            ctx.lineTo(bobX, bobY);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Render Mass Mass Point Bob Shape
            ctx.beginPath();
            ctx.arc(bobX, bobY, mass, 0, 2 * Math.PI);
            ctx.fillStyle = 'var(--accent-blue)';
            ctx.fill();
            ctx.strokeStyle = '#1e3a8a';
            ctx.lineWidth = 3;
            ctx.stroke();

            requestAnimationFrame(updatePhysicsLoop);
        }

        // Initialize execution grid on page load
        updatePhysicsLoop();
    </script>
</body>
</html>
