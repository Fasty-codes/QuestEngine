<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestEngine Arcade | Guessing Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #d97706;
            --accent-light: #fef3c7;
            --border: #e2e8f0;
            --radius-lg: 24px;
            --radius-md: 14px;
            --font-sans: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        body { background: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding-top: 90px; }

        nav { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 1000; height: 70px; }
        .nav-container { max-width: 1400px; margin: 0 auto; height: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 2rem; }
        .brand { font-size: 1.5rem; font-weight: 800; color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
        .brand span { color: var(--accent); }

        main { flex: 1; max-width: 600px; width: 100%; margin: 0 auto; padding: 2rem; display: flex; flex-direction: column; justify-content: center; }
        
        .mode-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
        .game-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.02); text-align: center; }
        
        .input-group { display: flex; flex-direction: column; gap: 0.75rem; margin: 2rem 0; text-align: left; }
        .input-group label { font-weight: 700; font-size: 0.9rem; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.05em; }
        .game-input { width: 100%; padding: 1rem; border: 1px solid var(--border); background: var(--bg-primary); border-radius: var(--radius-md); font-size: 1.1rem; font-weight: 600; text-align: center; outline: none; }
        .game-input:focus { border-color: var(--accent); }

        .btn { background: var(--accent); color: white; border: none; padding: 1rem 2rem; font-weight: 700; border-radius: var(--radius-md); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; transition: all 0.2s ease; }
        .btn:hover { background: #b45309; transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
        .btn-outline.active { background: var(--accent-light); border-color: var(--accent); color: #b45309; }

        .log-display { margin-top: 1.5rem; font-weight: 700; font-size: 1.1rem; color: var(--accent); min-height: 30px; }

        footer { background: #0f172a; color: #94a3b8; width: 100%; padding: 2rem; text-align: center; font-size: 0.9rem; margin-top: auto; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="brand"><i class="fa-solid fa-cubes"></i> Quest<span>Engine</span></a>
        </div>
    </nav>

    <main>
        <div class="mode-container">
            <button class="btn btn-outline active" id="btn-bot" onclick="setMode('bot')"><i class="fa-solid fa-robot"></i> VS Bot</button>
            <button class="btn btn-outline" id="btn-friend" onclick="setMode('friend')"><i class="fa-solid fa-user-group"></i> VS Friend</button>
        </div>

        <div class="game-card">
            <h2 id="panel-title">System Analysis</h2>
            <p id="panel-desc">Deduct the hidden integer value bounded between 1 and 100.</p>

            <div class="input-group" id="setup-block" style="display:none;">
                <label id="input-label">Set Secret Target</label>
                <input type="password" id="secret-input" class="game-input" placeholder="Enter target variable">
            </div>

            <div class="input-group" id="guess-block">
                <label>Input Guess Vector</label>
                <input type="number" id="guess-input" class="game-input" placeholder="00">
            </div>

            <button class="btn" id="action-btn" onclick="processAction()">Submit Parameter</button>
            <div class="log-display" id="feedback-log"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 QuestEngine Platform Ecosystem. All systems active.</p>
    </footer>

    <script>
        let currentMode = 'bot';
        let secretValue = 0;
        let isConfigured = false;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-bot').classList.toggle('active', mode === 'bot');
            document.getElementById('btn-friend').classList.toggle('active', mode === 'friend');
            resetMatrix();
        }

        function resetMatrix() {
            document.getElementById('feedback-log').innerText = '';
            document.getElementById('guess-input').value = '';
            document.getElementById('secret-input').value = '';
            
            if(currentMode === 'bot') {
                secretValue = Math.floor(Math.random() * 100) + 1;
                document.getElementById('panel-title').innerText = "System Analysis";
                document.getElementById('setup-block').style.display = 'none';
                document.getElementById('guess-block').style.opacity = '1';
                isConfigured = true;
            } else {
                document.getElementById('panel-title').innerText = "Dual Matrix Setup";
                document.getElementById('setup-block').style.display = 'flex';
                document.getElementById('guess-block').style.opacity = '0.5';
                isConfigured = false;
            }
        }

        function processAction() {
            if(!isConfigured && currentMode === 'friend') {
                const setupVal = parseInt(document.getElementById('secret-input').value);
                if(isNaN(setupVal) || setupVal < 1 || setupVal > 100) {
                    alert("Invalid parameter. Bounded constraints: 1 to 100.");
                    return;
                }
                secretValue = setupVal;
                isConfigured = true;
                document.getElementById('setup-block').style.display = 'none';
                document.getElementById('guess-block').style.opacity = '1';
                document.getElementById('panel-title').innerText = "Player 2 Verification Turn";
                return;
            }

            const guess = parseInt(document.getElementById('guess-input').value);
            const feedback = document.getElementById('feedback-log');

            if(isNaN(guess)) return;

            if(guess === secretValue) {
                feedback.innerText = "System synchronized. Correct Target Identified!";
                setTimeout(resetMatrix, 3000);
            } else if(guess < secretValue) {
                feedback.innerText = "Target matrix parameters lie HIGHER.";
            } else {
                feedback.innerText = "Target matrix parameters lie LOWER.";
            }
        }

        window.onload = resetMatrix;
    </script>
</body>
</html>
