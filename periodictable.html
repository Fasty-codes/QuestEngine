<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Neon Periodic Table | QuestEngine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030307;
            --panel-glass: rgba(10, 10, 20, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --font-sans: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
        
        /* Strict 100vh Layout Framework */
        body { 
            background: var(--bg-dark); 
            color: #fff; 
            height: 100vh; 
            max-height: 100vh;
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        header { 
            height: 60px; 
            background: rgba(3, 3, 7, 0.9); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--panel-border); 
            padding: 0 1.5rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }
        .logo { font-size: 1.25rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo i { color: #00e5ff; text-shadow: 0 0 8px #00e5ff; }

        /* Table Stage Window */
        .table-stage { 
            flex: 1; 
            padding: 2rem 1.5rem; 
            display: flex; 
            align-items: center; 
            overflow: auto; /* Triggers the beautiful scrollbar when screen is small */
            position: relative;
        }
        
        .neon-grid { 
            display: grid; 
            grid-template-columns: repeat(18, minmax(62px, 1fr)); 
            grid-template-rows: repeat(10, minmax(70px, 1fr));
            gap: 6px; 
            width: 100%;
            max-width: 1400px;
            margin: auto;
        }

        /* CUSTOM ULTRA-SLEEK NEON SCROLLBARS */
        .table-stage::-webkit-scrollbar,
        .inspector-panel::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .table-stage::-webkit-scrollbar-track,
        .inspector-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .table-stage::-webkit-scrollbar-thumb,
        .inspector-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            transition: background 0.3s;
        }
        .table-stage::-webkit-scrollbar-thumb:hover,
        .inspector-panel::-webkit-scrollbar-thumb:hover {
            background: #00e5ff;
            box-shadow: 0 0 10px #00e5ff;
        }

        /* Interactive Element Nodes */
        .element-node {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.01);
            cursor: pointer;
            position: relative;
            user-select: none;
            border: 2px solid hsl(var(--hue), 100%, 60%);
            box-shadow: 0 0 8px hsl(var(--hue), 100%, 60%, 0.25), inset 0 0 8px hsl(var(--hue), 100%, 60%, 0.15);
            color: hsl(var(--hue), 100%, 85%);
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s, background 0.2s;
        }
        .element-node:hover {
            transform: scale(1.15);
            z-index: 5;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 18px hsl(var(--hue), 100%, 60%, 0.6), inset 0 0 12px hsl(var(--hue), 100%, 60%, 0.4);
        }
        .element-node.active-selected {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px #fff, inset 0 0 15px hsl(var(--hue), 100%, 60%);
            border-color: #fff;
        }

        .atomic-num { font-size: 0.75rem; font-weight: 700; opacity: 0.8; }
        .symbol { font-size: 1.6rem; font-weight: 800; color: #fff; text-align: center; line-height: 1.1; text-shadow: 0 0 8px hsl(var(--hue), 100%, 60%); }
        .name-lbl { font-size: 0.55rem; text-align: center; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Placeholders (Lanthanides/Actinides slots in main row) */
        .placeholder-node { justify-content: flex-start; cursor: default; pointer-events: none; }
        .placeholder-node .name-lbl { font-size: 0.6rem; margin-top: auto; white-space: normal; line-height: 1.1; text-align: left; }

        /* Spacer Row for alignment */
        .grid-spacer { grid-row: 8; grid-column: 1 / -1; height: 15px; pointer-events: none; }

        /* SLIDING INSIDE FLYOUT DRAWER PANEL */
        .inspector-panel { 
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 380px; 
            background: var(--panel-glass); 
            border-left: 1px solid var(--panel-border); 
            backdrop-filter: blur(35px); 
            -webkit-backdrop-filter: blur(35px);
            padding: 2rem 1.5rem; 
            display: flex; 
            flex-direction: column; 
            gap: 1.5rem;
            overflow-y: auto;
            z-index: 2000;
            box-shadow: -15px 0 35px rgba(0,0,0,0.7);
            
            /* Hidden offscreen by default */
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* State trigger rule for JavaScript interaction */
        .inspector-panel.panel-open {
            transform: translateX(0);
        }

        .panel-header { 
            font-size: 1rem; 
            font-weight: 700; 
            color: #9ca3af; 
            border-bottom: 1px solid var(--panel-border); 
            padding-bottom: 0.75rem; 
            display: flex; 
            justify-content: space-between;
            align-items: center; 
        }
        .close-btn {
            background: transparent;
            border: none;
            color: #6b7280;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }
        .close-btn:hover { color: #fff; transform: scale(1.1); }

        /* Atomic Spec Layout Components */
        .giant-preview {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 2rem 1rem;
            text-align: center;
            border-top: 4px solid var(--live-color);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.01);
        }
        .giant-symbol { font-size: 4.5rem; font-weight: 800; color: #fff; line-height: 1; text-shadow: 0 0 25px var(--live-color); }
        .giant-name { font-size: 1.5rem; font-weight: 700; margin-top: 0.5rem; }
        .giant-category { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--live-color); margin-top: 0.25rem; }

        .data-grid { display: flex; flex-direction: column; gap: 0.75rem; }
        .data-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .data-row .label { color: #9ca3af; font-weight: 500; }
        .data-row .value { font-weight: 600; color: #fff; text-align: right; }
        
        .electron-shells { display: flex; gap: 5px; }
        .shell-dot { background: var(--live-color); padding: 2px 7px; border-radius: 5px; font-size: 0.75rem; font-weight: 700; color: #000; }

        /* RESPONSIVE DESIGN MEDIA OVERRIDES */
        @media (max-width: 600px) {
            .inspector-panel {
                width: 100%; /* Cover full width on mobile screens smoothly */
                border-left: none;
            }
        }
    </style>

        function getCategoryName(hue) {
            if (hue === 225) return "Reactive Nonmetal";
            if (hue === 335) return "Inner Transition Metal";
            switch(hue) {
                case 0: return "Alkali Metal";
                case 25: return "Alkaline Earth Metal";
                case 45: case 55: case 65: case 75: case 85: case 95: case 105: case 115: case 125: case 135: return "Transition Metal";
                case 155: return "Post-Transition Metal";
                case 185: return "Metalloid";
                case 255: return "Reactive Nonmetal";
                case 285: return "Halogen";
                case 310: return "Noble Gas";
                default: return "Unknown Classification";
            }
        }

        function calculateHue(num, col, row) {
            if (num === '1') return 225; // Hydrogen Blue Exception
            if (row >= 9 || num === '57-71' || num === '89-103') return 335; // Pink Blocks

            const hueMap = {
                1: 0, 2: 25, 3: 45, 4: 55, 5: 65, 6: 75, 7: 85, 8: 95, 
                9: 105, 10: 115, 11: 125, 12: 135, 13: 155, 14: 185, 
                15: 225, 16: 255, 17: 285, 18: 310
            };
            return hueMap[col] || 0;
        }

        function initMatrix() {
            const grid = document.getElementById('neonMatrix');

            const spacer = document.createElement('div');
            spacer.className = "grid-spacer";
            grid.appendChild(spacer);

            elementsData.forEach(elementStr => {
                const [num, sym, name, col, row, mass, config, shells, valence, state] = elementStr.split(',');
                const hue = calculateHue(num, parseInt(col), parseInt(row));
                
                const node = document.createElement('div');
                node.className = "element-node";
                node.style.gridColumn = col;
                node.style.gridRow = row;
                node.style.setProperty('--hue', hue);
                
                if (sym.trim() === '') {
                    node.classList.add('placeholder-node');
                    node.innerHTML = `
                        <div class="atomic-num">${num}</div>
                        <div class="name-lbl">${name}</div>
                    `;
                } else {
                    node.innerHTML = `
                        <div class="atomic-num">${num}</div>
                        <div class="symbol">${sym}</div>
                        <div class="name-lbl">${name}</div>
                    `;
                    
                    node.onclick = () => {
                        document.querySelectorAll('.element-node').forEach(n => n.classList.remove('active-selected'));
                        node.classList.add('active-selected');
                        
                        triggerInspection({ num, sym, name, mass, config, shells, valence, state, hue });
                    };
                }
                
                grid.appendChild(node);
            });

            // Close Sidebar Event
            document.getElementById('closePanelBtn').onclick = () => {
                document.getElementById('inspectorPanel').classList.remove('panel-open');
                document.querySelectorAll('.element-node').forEach(n => n.classList.remove('active-selected'));
            };
        }

        function triggerInspection(el) {
            const panel = document.getElementById('inspectorPanel');
            const hslColor = `hsl(${el.hue}, 100%, 60%)`;
            
            document.getElementById('previewBox').style.setProperty('--live-color', hslColor);

            // Populate Content Fields
            document.getElementById('inspectSymbol').innerText = el.sym;
            document.getElementById('inspectSymbol').style.textShadow = `0 0 20px ${hslColor}`;
            document.getElementById('inspectName').innerText = el.name;
            document.getElementById('inspectCategory').innerText = getCategoryName(el.hue);
            document.getElementById('inspectNum').innerText = el.num;
            document.getElementById('inspectMass').innerText = el.mass + " u";
            document.getElementById('inspectConfig').innerText = el.config;
            document.getElementById('inspectValence').innerText = el.valence;
            document.getElementById('inspectState').innerText = el.state;

            // Generate Electron Shell Elements
            const shellWrapper = document.getElementById('inspectShells');
            shellWrapper.innerHTML = '';
            el.shells.split('-').forEach(shellCount => {
                const dot = document.createElement('span');
                dot.className = "shell-dot";
                dot.innerText = shellCount;
                shellWrapper.appendChild(dot);
            });

            // Slide panel forward smoothly
            panel.classList.add('panel-open');
        }

        window.onload = initMatrix;
    </script>
